# M2 车牌识别全部算法参数（见开发文档 5.7）。
# 键名冻结；值可调，调整须在积分板（reports/scoreboard.md）备注。
# 自定义配置文件只需写要改的键，其余键沿用本文件。

[runtime]
torch_threads = 2
model_path = "models/char_cnn_v2.pt"     # 相对 algorithm/ 目录；指向 classifier 所选分类器的模型文件（10-26 切到 v2）
classifier = "cnn"                        # cnn | template | svm（对比实验用）
max_candidates = 3
corner_model_path = "models/corner_net_v1.pt"  # 四角点网络（K1 Plan B-1），空 = 不启用；相对 algorithm/ 目录（10-26 启用）
plate_reader_model_path = ""              # 整牌识别 CRNN（K1 Plan B-2），空 = 不启用；相对 algorithm/ 目录

[preprocess]
min_side = 120
work_width = 800                          # 定位工作宽度【待调】
clahe_clip = 2.0
clahe_grid = 8
blur_ksize = 5

[locate]
aspect_min = 2.0
aspect_max = 5.5
area_ratio_min = 0.001                    # 候选面积 / 工作图面积【待调】
area_ratio_max = 0.08
max_tilt_deg = 30
close_kernel_rel = [0.022, 0.006]         # 闭运算核（相对工作宽度）【待调】
min_row_transitions = 20                  # CCPD val 候选排序：文字行跳变归一化，WP-B 第四批
nms_iou = 0.3
blue_hsv   = [[100, 70, 40], [124, 255, 255]]   # OpenCV HSV，H 取值 0~179【待调】
yellow_hsv = [[15, 90, 70],  [35, 255, 255]]
green_hsv  = [[35, 50, 60],  [90, 255, 255]]

[rectify]
size_7 = [252, 80]                        # 冻结
size_8 = [276, 80]                        # 冻结
expand_ratio = 0.10
deskew_max_deg = 10

[segment]
binarize = "otsu"                         # otsu | adaptive
# CCPD2019 ccpd_base val: seed=42, sampled=2000, independent projection observations=1144 (Otsu 902 + adaptive 242).
# Frozen test-manifest paths excluded; robust median centers/width, 2026-10-25 WP-B batch 4.
# Evidence: D:/keshe2/algorithm/data/calib/wpb_batch4/base_val_2000.csv; worker out/batch4_b3/.
layout7_centers = [0.075397, 0.204365, 0.380952, 0.507937, 0.636905, 0.763889, 0.894841]
layout7_char_w = 0.103175
# CCPD2020 ccpd_green val: all 1001 eligible images, 734 independent projection observations (Otsu 351 + adaptive 383).
# Adopt independent-projection medians; mean regresses. Tiny validation gain is not significance evidence.
# Frozen test-manifest paths excluded; 2026-10-25 WP-B batch 4, see worker out/batch4_b3/.
layout8_centers = [0.076087, 0.193841, 0.378623, 0.489130, 0.599638, 0.710145, 0.818841, 0.927536]
layout8_char_w = 0.094203
char_size = 32                            # 冻结

[postprocess]
min_confidence = 0.80                     # E1 阈值【待调】
topk = 3
province_prior = {}                       # 例如 {"陕" = 1.5}，默认关闭
arbitration = "first_ok"                  # first_ok = 分割路线先出 OK 即返回、CRNN 只兜底；agree = 两条路线读法一致才自动通过（10-26 新增，待 03 定阈值）
agree_min_confidence = 0.0                # 以下四项只在 agree 且启用 CRNN 时生效【待调】
solo_min_confidence_segment = 1.01        # >1 = 关闭单边通过
solo_min_confidence_reader = 1.01
disagree_prefer = "reader"

[voting]
min_frames = 2
agree_frames = 3
window_s = 2.0

[dedup]
window_s = 30                             # 【待调】
dhash_max_hamming = 10

[lanes]                                   # 车道 ROI（原图坐标 x, y, w, h），不配置则用全图
# "1" = [320, 200, 640, 400]
