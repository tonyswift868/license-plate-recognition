[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpr"
dynamic = ["version"]
description = "停车场收费系统 M2 车牌识别模块（纯 Python 算法包）"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9,<5",
    "torch>=2.2",
    "scikit-learn>=1.3",
    "pydantic>=2.6",
    "loguru>=0.7",
]

[project.optional-dependencies]
tools = ["pillow>=10"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-benchmark>=4"]

[tool.setuptools.dynamic]
version = { attr = "lpr._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["lpr*", "lpr_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 保证在任何 worktree 里跑测试，导入的都是当前检出的 lpr，而不是别处的可编辑安装
pythonpath = ["."]
markers = [
    "golden: 金样例回归（需要 tests/data/golden/ 下的图片）",
]
